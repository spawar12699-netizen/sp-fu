export default {
  async fetch(req: Request, env: Env) {
    const url = new URL(req.url);
    const apiKey = req.headers.get('x-api-key') || '';
    // Auth: find client by read/write key
    if (url.pathname === '/api/data' && req.method === 'POST') {
      const client = await env.DB.prepare(
        'SELECT * FROM clients WHERE apiWriteKey = ? AND status="active"'
      ).bind(apiKey).first();
      if (!client) return new Response('Invalid write key', {status:401});
      const body = await req.json() as Record<string,string>;
      const count = await env.DB.prepare(
        'SELECT MAX(no) as maxNo FROM data_entries WHERE clientId = ?'
      ).bind(client.id).first();
      const nextNo = (count?.maxNo as number || 0) + 1;
      await env.DB.prepare(
        'INSERT INTO data_entries (id, clientId, no, timestamp, values) VALUES (?,?,?,?,?)'
      ).bind(crypto.randomUUID(), client.id, nextNo, new Date().toISOString(), JSON.stringify(body)).run();
      return Response.json({success:true, no: nextNo});
    }
    if (url.pathname === '/api/data' && req.method === 'GET') {
      const client = await env.DB.prepare(
        'SELECT * FROM clients WHERE apiReadKey = ?'
      ).bind(apiKey).first();
      if (!client) return new Response('Invalid read key', {status:401});
      const limit = Math.min(parseInt(url.searchParams.get('limit')||'100'), 1000);
      const rows = await env.DB.prepare(
        'SELECT * FROM data_entries WHERE clientId = ? ORDER BY timestamp DESC LIMIT ?'
      ).bind(client.id, limit).all();
      return Response.json(rows.results);
    }
